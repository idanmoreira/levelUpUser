name: Deploy

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: true

jobs:
  trigger-easypanel:
    name: Trigger Easypanel rebuild
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    env:
      EASYPANEL_DEPLOY_WEBHOOK_URL: ${{ secrets.EASYPANEL_DEPLOY_WEBHOOK_URL }}
      PRODUCTION_HEALTHCHECK_URL: ${{ secrets.PRODUCTION_HEALTHCHECK_URL }}

    steps:
      - name: Skip when webhook is not configured
        if: ${{ env.EASYPANEL_DEPLOY_WEBHOOK_URL == '' }}
        run: echo "EASYPANEL_DEPLOY_WEBHOOK_URL is not configured."

      - name: Trigger rebuild webhook
        if: ${{ env.EASYPANEL_DEPLOY_WEBHOOK_URL != '' }}
        run: |
          curl --fail --silent --show-error \
            --request POST \
            "$EASYPANEL_DEPLOY_WEBHOOK_URL"

      - name: Verify deployed release
        if: ${{ env.EASYPANEL_DEPLOY_WEBHOOK_URL != '' && env.PRODUCTION_HEALTHCHECK_URL != '' }}
        env:
          EXPECTED_RELEASE: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail

          for attempt in {1..30}; do
            if curl --fail --silent --show-error \
              "${PRODUCTION_HEALTHCHECK_URL%/}/release.json" \
              | jq --exit-status --arg release "$EXPECTED_RELEASE" '.release == $release' >/dev/null; then
              echo "Release $EXPECTED_RELEASE is healthy."
              exit 0
            fi

            echo "Waiting for release $EXPECTED_RELEASE (attempt $attempt/30)."
            sleep 10
          done

          echo "Release $EXPECTED_RELEASE did not become healthy in time."
          exit 1

      - name: Skip release verification when healthcheck is not configured
        if: ${{ env.PRODUCTION_HEALTHCHECK_URL == '' }}
        run: echo "PRODUCTION_HEALTHCHECK_URL is not configured."
